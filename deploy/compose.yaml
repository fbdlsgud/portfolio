name: portfolio-mac

services:
  web:
    build:
      context: ../frontend
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY public ./public
        COPY src ./src
        ENV REACT_APP_API_URL=/api
        RUN npm run build

        FROM caddy:2-alpine
        COPY --from=build /app/build /srv
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${PORTFOLIO_HTTP_PORT:-28180}:80"
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile_inline: |
        FROM eclipse-temurin:17-jdk AS build
        WORKDIR /app
        COPY gradle ./gradle
        COPY gradlew build.gradle settings.gradle ./
        COPY src ./src
        RUN sh gradlew --no-daemon bootJar && mv build/libs/*.jar /app/server.jar

        FROM eclipse-temurin:17-jre
        WORKDIR /app
        COPY --from=build /app/server.jar ./server.jar
        USER 10001:10001
        ENTRYPOINT ["java", "-jar", "/app/server.jar"]
    environment:
      SERVER_PORT: "8070"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: "${PORTFOLIO_DB_PASSWORD:?}"
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: "${PORTFOLIO_DB_PASSWORD:?}"
      MYSQL_ROOT_PASSWORD: "${PORTFOLIO_DB_ROOT_PASSWORD:?}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u portfolio portfolio -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 24
    restart: unless-stopped

volumes:
  mysql-data:
