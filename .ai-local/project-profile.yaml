# Installed from Agentic Dev Kit profile: react-vite

project:
  name: portfolio
  profile: "react-vite"
  description: "React and Spring Boot portfolio monorepo"


stack:
  frontend: React react-scripts
  backend: Spring Boot 3.4.5 (Java 17)
  database: MySQL
  package_manager: npm and Gradle Wrapper

paths:
  frontend: frontend
  backend: backend
  deploy: deploy
  docs: docs
  ai_docs: docs/ai

commands:
  install: npm --prefix frontend ci
  dev: npm --prefix frontend start
  lint: ""
  typecheck: ""
  test: npm --prefix frontend test -- --watchAll=false
  build: npm --prefix frontend run build
  backend_build: cd backend && ./gradlew bootJar

quality:
  required_before_done:
    - lint
    - typecheck
    - build
  screenshots_required_for_ui: true


command_policy:
  source: "detected-project-files"
  confirm_before_first_use: false
  notes: "Commands verified against frontend/package.json and backend/build.gradle."

agent:
  default_workflow: "implement"
  prefer_subagents_for_broad_tasks: true
  permanent_rule_changes_require_review: true
